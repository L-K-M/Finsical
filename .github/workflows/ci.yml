name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bash -n parses only its first operand, so one file at a time.
      - run: for f in scripts/*.sh linux/*.sh; do bash -n "$f"; done
      # package.json, Info.plist and the README's "Latest release" marker
      # must name the same version; scripts/release.sh bumps all three.
      - run: node scripts/check-version.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:sound-store
      # The tank page's cross-window contract (deferred machine commits,
      # client state pushes, spectator persistence) in the same Chrome.
      - run: npm run verify:pr-integration
      - run: npm run verify:spectator
      # Mac PICT scenery from archive.org and drops, with archive.org
      # answered by synthesized pictures.
      - run: npm run verify:mac-scenery
      # The runner's Chrome exercises real Canvas blending and alpha.
      - run: npm run test:caustics
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -t .
      # The Linux shell's pure logic; its GTK side runs in linux-deb.
      - run: python3 -m unittest discover -s linux/tests -p 'test_*.py' -t linux
  linux-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GdkPixbuf (through python3-gi) renders the package's icons; the
      # GTK and WebKitGTK bindings and Xvfb run the smoke test.
      - name: Install packaging and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lintian desktop-file-utils appstream xvfb xauth \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-webkit-6.0
      - run: npm ci
      # --check: desktop-file-validate, appstreamcli and lintian.
      - run: linux/build-deb.sh --check
      - run: linux/build-tarball.sh
      - run: sudo apt-get install -y ./out/Finsical-*-linux.deb
      # Loads the tank and every window from the installed package and
      # checks the bus relay end to end (see "Smoke test" in README.md).
      # Ubuntu's AppArmor user-namespace restriction is on here, so this
      # also proves the package's profile lets WebKit's sandbox start.
      # With a session bus, so the global menu's step runs too.
      - run: xvfb-run -a dbus-run-session -- /usr/games/finsical --smoke-test
      # Purge the .deb so the tarball's launcher can only resolve its
      # own share/finsical tree; a /usr fallback would mask a break.
      - run: sudo dpkg --purge finsical
      # The tarball gets the same end-to-end check from its own tree:
      # bin/finsical finds share/finsical next to itself. It has no
      # AppArmor profile, so it runs as on a distribution without
      # Ubuntu's user-namespace restriction (Fedora, Arch, Debian).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          mkdir tarball && tar -xzf out/Finsical-*-linux.tar.gz -C tarball
          xvfb-run -a ./tarball/Finsical-*-linux/bin/finsical --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finsical-linux
          path: out/Finsical-*-linux.*
          if-no-files-found: error
          retention-days: 7
  linux-flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Flatpak's own tools (its portal serves WebKit's sandbox), and
      # GdkPixbuf for the tarball's icons. Ubuntu 24.04 denies the
      # unprivileged user namespaces bubblewrap builds and runs in.
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb xauth \
            python3-gi gir1.2-gdkpixbuf-2.0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      # Fetches the GNOME runtime and SDK from Flathub on the way.
      - run: linux/build-flatpak.sh --install
      # The same end-to-end check inside the sandbox.
      - run: xvfb-run -a dbus-run-session -- flatpak run --user dev.finsical.app --smoke-test
      # Again with a locale the runtime lacks and a non-ASCII variable:
      # WebKit hands its whole environment to flatpak-spawn, which
      # rejected it in the ASCII fallback locale (app.py
      # _ensure_utf8_locale).
      - run: xvfb-run -a dbus-run-session -- flatpak run --user dev.finsical.app --smoke-test
        env:
          LANG: xx_XX.UTF-8
          FINSICAL_CI_TEXT: Öffentlich
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finsical-flatpak
          path: out/Finsical-*-linux.flatpak
          if-no-files-found: error
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # Also validates the checked-in Gradle wrapper jar's checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      # The release APK stays unsigned here; only the Release workflow
      # has the signing key.
      # lint covers the debug variant only; lintRelease checks release.
      - run: ./gradlew assembleDebug assembleRelease lint lintRelease test
        working-directory: android
      # THIRD_PARTY_NOTICES.md promises the LGPL decoder's source in the
      # APK; a byte compare catches a missing or stale copy.
      - name: Check the APK ships the decoder source
        run: |
          unzip -p android/app/build/outputs/apk/release/Finsical-*-android-release-unsigned.apk \
            assets/core/data/mace.ts | cmp - core/data/mace.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finsical-android-debug
          path: android/app/build/outputs/apk/debug/Finsical-*-android-debug.apk
          if-no-files-found: error
          retention-days: 7
      # Nothing else runs the app on Android: boot an emulator, open the
      # tank and a panel, and wait for the relayed state (SmokeTest.java).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          # The action runs each script line in its own shell, so the
          # smoke logic lives in one script.
          script: scripts/android-smoke.sh android/app/build/outputs/apk/debug/Finsical-*-android-debug.apk 300
  native-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/build.sh --clean --install
      - run: test -x /Applications/Finsical.app/Contents/MacOS/Finsical
      # The notices file promises the LGPL decoder's source ships in
      # the bundle (license text one directory up), not only the
      # compiled copy inside the JavaScript. A byte compare, so a
      # stale or wrong copy fails too.
      - run: diff -u core/data/mace.ts /Applications/Finsical.app/Contents/Resources/core/data/mace.ts
      # Launch the app: --smoke-test loads the tank page, checks that its
      # script ran and the case art went in, and exits 0 (1 broken page,
      # 2 load failed, 3 timed out after 30 s). The /private/tmp copy runs
      # from the same kind of path App Translocation gives an app opened
      # where it was unzipped, which once served no files at all.
      - run: /Applications/Finsical.app/Contents/MacOS/Finsical --smoke-test
        timeout-minutes: 2
      - run: |
          ditto /Applications/Finsical.app /private/tmp/Finsical.app
          /private/tmp/Finsical.app/Contents/MacOS/Finsical --smoke-test
        timeout-minutes: 2
      # Swift 6 language mode: its data-race checks cover Osmium UI's
      # window host too, which the app compiles in. Warnings fail the
      # build: a delegate method that only nearly matches its
      # requirement is a warning, and WebKit would never call it.
      - run: make -C macos SWIFT_VERSION=6 SWIFTFLAGS=-warnings-as-errors
