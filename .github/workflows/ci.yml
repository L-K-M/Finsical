name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n scripts/*.sh linux/*.sh
      # package.json, Info.plist and the README's "Latest release" marker
      # must name the same version; scripts/release.sh bumps all three.
      - run: node scripts/check-version.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -t .
      # The Linux shell's pure logic; its GTK side runs in linux-deb.
      - run: python3 -m unittest discover -s linux/tests -p 'test_*.py' -t linux
  linux-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GdkPixbuf (through python3-gi) renders the package's icons; the
      # GTK and WebKitGTK bindings and Xvfb run the smoke test.
      - name: Install packaging and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lintian desktop-file-utils appstream xvfb xauth \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
      - run: npm ci
      # --check: desktop-file-validate, appstreamcli and lintian.
      - run: linux/build-deb.sh --check
      - run: sudo apt-get install -y ./out/Finsical-*-linux.deb
      # Loads the tank and every window from the installed package and
      # checks the bus relay end to end (see "Smoke test" in README.md).
      - run: xvfb-run -a /usr/games/finsical --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finsical-linux-deb
          path: out/Finsical-*-linux.deb
          if-no-files-found: error
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # Also validates the checked-in Gradle wrapper jar's checksum.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: npm ci
      # The release APK stays unsigned here; only the Release workflow
      # has the signing key.
      # lint covers the debug variant only; lintRelease checks release.
      - run: ./gradlew assembleDebug assembleRelease lint lintRelease test
        working-directory: android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finsical-android-debug
          path: android/app/build/outputs/apk/debug/Finsical-*-android-debug.apk
          if-no-files-found: error
          retention-days: 7
      # Nothing else runs the app on Android: boot an emulator, open the
      # tank and a panel, and wait for the relayed state (SmokeTest.java).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          # The action runs each script line in its own shell, so the
          # smoke logic lives in one script.
          script: scripts/android-smoke.sh android/app/build/outputs/apk/debug/Finsical-*-android-debug.apk 300
  native-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/build.sh --clean --install
      - run: test -x /Applications/Finsical.app/Contents/MacOS/Finsical
      # The notices file promises the LGPL decoder's source ships in
      # the bundle (license text one directory up), not only the
      # compiled copy inside the JavaScript. A byte compare, so a
      # stale or wrong copy fails too.
      - run: diff -u core/data/mace.ts /Applications/Finsical.app/Contents/Resources/core/data/mace.ts
      # Swift 6 language mode: its data-race checks cover Osmium UI's
      # window host too, which the app compiles in. Warnings fail the
      # build: a delegate method that only nearly matches its
      # requirement is a warning, and WebKit would never call it.
      - run: make -C macos SWIFT_VERSION=6 SWIFTFLAGS=-warnings-as-errors
