<!doctype html>
<html lang="en" class="osm-page">
<head>
  <meta charset="utf-8" />
  <title>Preferences</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath fill='%23d08030' d='M5 3h5v1H5zM4 4h7v1H4zM12 4h2v1h-2zM3 5h8v1H3zM13 5h1v1h-1zM2 6h10v1H2zM14 6h1v1h-1zM1 7h12v1H1zM13 7h2v1h-2zM1 8h12v1H1zM14 8h1v1h-1zM2 9h10v1H2zM13 9h1v1h-1zM3 10h8v1H3zM12 10h2v1h-2zM4 11h7v1H4zM5 12h5v1H5z'/%3E%3Crect x='3' y='6' width='2' height='2' fill='%232a1e10'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="osmium.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- A Mac OS 8 control panel: pane buttons down the left (Desktop
       Pictures style), the chosen pane on the right, and a caption
       area along the bottom explaining whatever the pointer is on.
       prefs.ts fills in the controls. -->
  <div id="pwin" class="osm-page-window">
    <div class="osm-content">
      <div id="pfstrip" role="tablist" aria-orientation="vertical"
           aria-label="Settings"></div>
      <div id="pfpanes">
        <section id="pane-machine" class="pfpane" role="tabpanel">
          <div id="pfmachines"></div>
          <div id="pfpreview" class="osm-well" aria-hidden="true"></div>
        </section>
        <section id="pane-monitor" class="pfpane" role="tabpanel" hidden>
          <label class="osm-checkbox" id="pfcrt">
            <input type="checkbox" id="crt-on" />Simulate a CRT monitor
          </label>
          <div class="osm-caption" id="crt-warn" hidden>This Mac can't show
            the effect (WebGL is unavailable or the graphics context was
            lost). Settings are kept for later.</div>
          <div id="pfpresets" role="group" aria-label="Picture presets"></div>
          <div id="pftraits"></div>
        </section>
        <section id="pane-picture" class="pfpane" role="tabpanel" hidden>
          <div id="pfpicture"></div>
        </section>
        <section id="pane-lighting" class="pfpane" role="tabpanel" hidden>
          <div class="osm-group pfgroup" id="pflights" role="group"
               aria-label="Lights">
            <div class="osm-group-title">Lights</div>
            <div class="pflrow">
              <span class="pflctl" id="plc-mode">
                <label class="osm-popup-title" for="pl-mode">Lighting:</label>
                <button type="button" class="osm-popup" id="pl-mode"></button>
              </span>
            </div>
            <div class="pflrow">
              <span class="pflctl" id="plc-on">
                <label class="osm-popup-title" for="pl-on">Lights on at:</label>
                <button type="button" class="osm-popup pfhour" id="pl-on"></button>
              </span>
              <span class="pflctl" id="plc-off">
                <label class="osm-popup-title" for="pl-off">Off at:</label>
                <button type="button" class="osm-popup pfhour" id="pl-off"></button>
              </span>
            </div>
            <div class="pflrow">
              <label class="osm-checkbox" id="pflamp">
                <input type="checkbox" id="pl-lamp" />Lamp on
              </label>
            </div>
          </div>
        </section>
        <!-- Laid out like Monitors & Sound's Sound section: the volume
             with its Mute box, then the tank's own sounds. -->
        <section id="pane-sound" class="pfpane" role="tabpanel" hidden>
          <div class="osm-group pfgroup" role="group" aria-label="Volume">
            <div class="osm-group-title">Volume</div>
            <div class="pfrow">
              <div class="pfslider" id="pfvol">
                <div class="osm-slider">
                  <input type="range" id="snd-volume" min="0" max="100"
                         step="1" aria-label="Volume" />
                </div>
                <div class="osm-caption pfends" aria-hidden="true">
                  <span>Off</span><span>Loud</span>
                </div>
              </div>
              <label class="osm-checkbox" id="pfmute">
                <input type="checkbox" id="snd-mute" />Mute
              </label>
            </div>
          </div>
          <div class="osm-group pfgroup" role="group" aria-label="Tank Sounds">
            <div class="osm-group-title">Tank Sounds</div>
            <label class="osm-checkbox" id="pfbubbles">
              <input type="checkbox" id="snd-bubbles" />Bubble sounds
            </label>
            <label class="osm-checkbox" id="pfambient">
              <input type="checkbox" id="snd-ambient" />Water ambience
            </label>
          </div>
        </section>
        <div id="pffoot">
          <div class="osm-separator"></div>
          <div id="pfdesc" aria-live="polite"></div>
          <button type="button" class="osm-button" id="pfdefaults">Defaults</button>
        </div>
      </div>
    </div>
  </div>
  <script src="prefs.js"></script>
</body>
</html>
