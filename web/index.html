<!doctype html>
<html lang="en" class="tankroot">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Finsical is a retro virtual aquarium for macOS, in the spirit of the 90s Mac classic AquaZone." />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta property="og:title" content="Finsical" />
  <meta property="og:description" content="A retro virtual aquarium in the spirit of the 90s Mac classic AquaZone." />
  <meta property="og:type" content="website" />
  <title>Finsical</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="osmium.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="tankpage">
  <noscript><p>Finsical needs JavaScript to run the aquarium.</p><style>#screen,#machine,#screenback{display:none}</style></noscript>
  <!-- Startup adds rear case art below the backplate and aquarium.
       Front art stays on top. Both art layers pass pointer input
       through to the tank or the page's window-drag handler. -->
  <div id="screenback"></div>
  <div id="screen">
    <canvas id="tank" width="320" height="200" role="img"
            aria-label="Aquarium. Click above the waterline or press F to feed the fish; click in the water to tap the glass."></canvas>
    <canvas id="crt" aria-hidden="true"></canvas>
  </div>
  <div id="machine">
    <svg id="shell" preserveAspectRatio="xMidYMid meet"
         role="presentation"></svg>
  </div>
  <!-- Turn On Sound: shown while the browser holds back the tank's
       sounds until a click (web/main.ts, syncAudioHint). -->
  <button id="audio-hint" class="osm-button" type="button" hidden>Turn On Sound</button>
  <div id="scold-banner" role="status" aria-atomic="true"></div>
  <script src="bundle.js"></script>
</body>
</html>
