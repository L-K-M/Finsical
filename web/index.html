<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Finsical</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #hint {
      position: fixed; top: 6px; left: 8px; z-index: 1;
      color: #9ab; font: 12px monospace; opacity: .6;
      pointer-events: none;
    }
    #importbtn {
      position: fixed; top: 4px; right: 6px; z-index: 2;
      background: none; border: 0; cursor: pointer;
      color: #9ab; font: 12px monospace; opacity: .6;
    }
    #importbtn:hover { opacity: 1; }
    #importpanel {
      position: fixed; top: 24px; right: 6px; z-index: 2;
      max-height: 80vh; overflow-y: auto; width: 190px;
      background: rgba(8, 14, 24, .92); border: 1px solid #234;
      color: #9ab; font: 12px monospace; padding: 6px;
    }
    #importpanel .sec {
      color: #cde; margin: 6px 0 2px; text-transform: uppercase;
      letter-spacing: 1px;
    }
    #importpanel .item {
      display: block; width: 100%; text-align: left;
      background: none; border: 0; cursor: pointer;
      color: #9ab; font: 12px monospace; padding: 2px 4px;
    }
    #importpanel .item:hover:not(:disabled) { color: #fff; background: #123; }
    #importpanel .item:disabled { color: #578; }
    canvas {
      display: block; width: 100vw; height: 100vh; object-fit: contain;
      image-rendering: pixelated; /* keep the crunch */
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="hint">click surface to feed &middot; click glass to tap &middot; drop an .azpack folder to import fish</div>
  <canvas id="tank" width="320" height="200"></canvas>
  <script src="bundle.js"></script>
</body>
</html>
