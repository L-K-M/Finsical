<!doctype html>
<html lang="en" class="tankroot">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finsical</title>
  <link rel="stylesheet" href="osmium.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="tankpage">
  <!-- Three layers: the dark screen backplate under the aquarium, then
       the machine art on top so its glass and reflections overlay the
       water. #machine is pointer-events:none — clicks fall through to
       the tank, or to the page body (a window drag) elsewhere. -->
  <div id="screenback"></div>
  <div id="screen">
    <canvas id="tank" width="320" height="200" role="img"
            aria-label="Aquarium. Click above the waterline or press F to feed the fish; click in the water to tap the glass."></canvas>
    <canvas id="crt" aria-hidden="true"></canvas>
  </div>
  <div id="machine">
    <svg id="shell" preserveAspectRatio="xMidYMid meet"
         role="presentation"></svg>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
