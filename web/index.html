<!doctype html>
<html lang="en" class="tankroot">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finsical</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath fill='%23d08030' d='M5 3h5v1H5zM4 4h7v1H4zM12 4h2v1h-2zM3 5h8v1H3zM13 5h1v1h-1zM2 6h10v1H2zM14 6h1v1h-1zM1 7h12v1H1zM13 7h2v1h-2zM1 8h12v1H1zM14 8h1v1h-1zM2 9h10v1H2zM13 9h1v1h-1zM3 10h8v1H3zM12 10h2v1h-2zM4 11h7v1H4zM5 12h5v1H5z'/%3E%3Crect x='3' y='6' width='2' height='2' fill='%232a1e10'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="osmium.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="tankpage">
  <!-- Three layers: the dark screen backplate under the aquarium, then
       the machine art on top so its glass and reflections overlay the
       water. #machine is pointer-events:none — clicks fall through to
       the tank, or to the page body (a window drag) elsewhere. -->
  <div id="screenback"></div>
  <div id="screen">
    <canvas id="tank" width="320" height="200" role="img"
            aria-label="Aquarium. Click above the waterline or press F to feed the fish; click in the water to tap the glass."></canvas>
    <canvas id="crt" aria-hidden="true"></canvas>
  </div>
  <div id="machine">
    <svg id="shell" preserveAspectRatio="xMidYMid meet"
         role="presentation"></svg>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
