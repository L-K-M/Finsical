<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Finsical</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    /* Add-on browser overlay. Interactive content stays below the top
       22px native drag strip — a full-height overlay would swallow it. */
    .ov {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      padding: 30px 12px 12px; box-sizing: border-box;
      background: rgba(3, 7, 13, .72);
      font: 13px/1.4 -apple-system, system-ui, sans-serif;
    }
    .card {
      width: min(560px, 100%); max-height: 100%;
      display: flex; flex-direction: column;
      background: #101823; border: 1px solid #24344a;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
    }
    .hd {
      display: flex; align-items: center;
      padding: 12px 14px 10px; border-bottom: 1px solid #1c2938;
    }
    .hd .title { color: #e8eef6; font-weight: 600; font-size: 14px; }
    .hd .sub { color: #6b7f96; font-size: 11px; }
    .hd .titles { flex: 1; }
    .hd .x {
      background: none; border: 0; cursor: pointer;
      color: #6b7f96; font-size: 14px; padding: 4px 8px;
    }
    .hd .x:hover { color: #fff; }
    .body { overflow-y: auto; padding: 10px 14px; flex: 1; }
    .sec {
      color: #8fa5bd; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.2px;
      margin: 10px 0 6px;
    }
    .grid {
      display: grid; gap: 6px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    .tile {
      position: relative; display: flex; flex-direction: column;
      align-items: center; gap: 6px; padding: 10px 8px;
      background: #0c1420; border: 1px solid #1c2938; border-radius: 8px;
      color: #b8c7d8; font: inherit; cursor: pointer; text-align: center;
    }
    .tile:hover { border-color: #3b567a; color: #fff; background: #111d2e; }
    .tile .tname { font-size: 12px; overflow-wrap: anywhere; }
    .tile .tthumb { image-rendering: pixelated; max-width: 96px; max-height: 64px; }
    .tile .tick {
      display: none; position: absolute; top: 5px; right: 7px;
      color: #7ddb8a; font-size: 12px;
    }
    .tile.done .tick { display: block; }
    .detail .back {
      background: none; border: 0; cursor: pointer; padding: 0 0 8px;
      color: #6f9fd8; font: inherit; font-size: 12px;
    }
    .detail .back:hover { color: #a8ccf5; }
    .detail .dname { color: #e8eef6; font-size: 16px; font-weight: 600; }
    .detail .dmeta { color: #6b7f96; font-size: 11px; margin: 2px 0 10px; }
    .detail .pv {
      display: flex; justify-content: center; padding: 10px;
      background: #081120; border: 1px solid #1c2938; border-radius: 8px;
      min-height: 60px; align-items: center;
    }
    .detail .pv canvas { image-rendering: pixelated; max-width: 100%; max-height: 180px; }
    .detail .dstatus, .browse .dstatus { color: #8fa5bd; font-size: 12px; margin: 10px 0; }
    #opentrigger {
      position: fixed; right: 8px; bottom: 8px; z-index: 5;
      background: rgba(16, 24, 35, .8); border: 1px solid #24344a;
      border-radius: 14px; cursor: pointer; opacity: .5;
      color: #b8c7d8; font: 12px/1 -apple-system, system-ui, sans-serif;
      padding: 6px 12px;
    }
    #opentrigger:hover { opacity: 1; }
    @media (hover: none) { #opentrigger { opacity: .85; padding: 10px 16px; } }
    .detail .dact, .browse .dact {
      background: #2b6cb8; border: 0; border-radius: 7px; cursor: pointer;
      color: #fff; font: inherit; font-weight: 600; padding: 8px 16px;
    }
    .detail .dact:hover, .browse .dact:hover { background: #3580d4; }
    .ft {
      padding: 8px 14px; border-top: 1px solid #1c2938; text-align: center;
    }
    .ft a { color: #e06c6c; font-size: 11px; text-decoration: none; }
    .ft a:hover { text-decoration: underline; }
    canvas {
      display: block; width: 100vw; height: 100vh; object-fit: contain;
      image-rendering: pixelated; /* keep the crunch */
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="tank" width="320" height="200"></canvas>
  <script src="bundle.js"></script>
</body>
</html>
