<head>
  <meta charset="utf-8" />
  <title>Tank Overview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath fill='%23d08030' d='M5 3h5v1H5zM4 4h7v1H4zM12 4h2v1h-2zM3 5h8v1H3zM13 5h1v1h-1zM2 6h10v1H2zM14 6h1v1h-1zM1 7h12v1H1zM13 7h2v1h-2zM1 8h12v1H1zM14 8h1v1h-1zM2 9h10v1H2zM13 9h1v1h-1zM3 10h8v1H3zM12 10h2v1h-2zM4 11h7v1H4zM5 12h5v1H5z'/%3E%3Crect x='3' y='6' width='2' height='2' fill='%232a1e10'/%3E%3C/svg%3E" />

<body>
  <!-- A Finder list-view window of what's in the tank: header placard,
       sortable column headers, the list, and a strip with Remove.
       overview.ts fills it in. -->
  <div id="owin" class="osm-page-window">
    <div class="osm-content">
      <div id="osummary" class="osm-placard"></div>
      <div id="oheads" class="osm-colheads"></div>
      <div id="olist"></div>
      <div id="obar">
        <button type="button" class="osm-button" id="ouse" disabled>Use</button>
        <button type="button" class="osm-button" id="oempty">Empty Tank…</button>
        <button type="button" class="osm-button" id="oremove" disabled>Remove</button>
      </div>
    </div>
  </div>
  <script src="overview.js"></script>
</body>
</html>
