<!doctype html>
<html lang="en" class="osm-page">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Finsical Tank Overview: everything in the retro aquarium, as a Finder-style list." />
  <meta name="theme-color" content="#dddddd" />
  <meta name="color-scheme" content="light" />
  <title>Tank Overview</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="osmium.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <noscript><p>Finsical needs JavaScript to show the tank.</p><style>#owin{display:none}</style></noscript>
  <!-- A Finder list-view window of what's in the tank: header placard,
       sortable column headers, the list, and a strip with Rename and
       Remove.
       overview.ts fills it in. -->
  <div id="owin" class="osm-page-window">
    <div class="osm-content">
      <div id="osummary" class="osm-placard"></div>
      <div id="oheads" class="osm-colheads"></div>
      <div id="olist"></div>
      <div id="obar">
        <button type="button" class="osm-button" id="ouse" disabled hidden>Use</button>
        <button type="button" class="osm-button" id="oempty">Empty Tank…</button>
        <button type="button" class="osm-button" id="orename" disabled>Rename…</button>
        <button type="button" class="osm-button" id="oremove" disabled>Remove</button>
      </div>
    </div>
  </div>
  <script src="overview.js"></script>
</body>
</html>
